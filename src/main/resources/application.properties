# ============================================================
# JPA/Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
# open-in-view=false: prevents connection held open for entire HTTP request lifecycle (performance critical)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Disabled in production: format_sql and use_sql_comments add overhead with no benefit
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
# NOTE: hibernate.dialect removed - Hibernate 6 auto-detects MySQL, explicit value causes HHH90000025 warnings

# Batch write optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Performance tuning
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ============================================================
# HikariCP Connection Pool
# ============================================================
# FIX: idle-timeout must be < MySQL wait_timeout (default 28800s / 8h).
# 600000ms (10 min) is safe. The previous 30000ms (30s) caused constant
# connection churn — pool was destroying and recreating connections every 30s.
spring.datasource.hikari.pool-name=ArtDecorHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# keepalive-time: sends a test query to keep idle connections alive in MySQL
# Must be < idle-timeout. Prevents "Connection is closed" errors after inactivity.
spring.datasource.hikari.keepalive-time=60000
# Validate connection before borrowing to avoid stale connections after WildFly restart
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# ============================================================
# Jackson Configuration
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# Swagger / OpenAPI
# ============================================================
# PRODUCTION: Swagger is DISABLED to prevent:
# 1. Full reflection scan of all controllers/DTOs causing CPU spike on first access
# 2. Memory exhaustion on low-memory VPS
# 3. Exposing internal API structure publicly
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false
# Re-enable for dev/test (comment out the two lines above and uncomment below):
 springdoc.swagger-ui.path=/swagger-ui.html
 springdoc.api-docs.path=/v3/api-docs
 springdoc.pre-loading-enabled=true
 springdoc.packages-to-scan=org.artanddecor.controllers
 springdoc.cache.disabled=false

